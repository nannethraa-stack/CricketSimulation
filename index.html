<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hawk-Eye Cricket Simulator Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ui">
    <h1>🏏 Hawk-Eye Pro</h1>

    <div class="controls">
      <label>Speed (km/h): <span id="speedVal">132</span></label>
      <input type="range" id="speed" min="95" max="150" value="132" />

      <label>Length (m): <span id="lengthVal">7.4</span></label>
      <input type="range" id="length" min="3.0" max="13.0" step="0.1" value="7.4" />

      <label>Line (m): <span id="lineVal">0.10</span></label>
      <input type="range" id="line" min="-0.9" max="0.9" step="0.05" value="0.10" />

      <label>Swing (cm): <span id="swingVal">8</span></label>
      <input type="range" id="swing" min="-25" max="25" value="8" />

      <label>Seam (cm): <span id="seamVal">5</span></label>
      <input type="range" id="seam" min="-20" max="20" value="5" />

      <button id="bowlBtn">Bowl Delivery</button>
      <button id="resetBtn">Clear All</button>
    </div>

    <div class="view-toggles">
      <button id="btnBeehive" class="active">Beehive</button>
      <button id="btnWagon">Wagon Wheel</button>
    </div>

    <div id="info">
      <p id="stats">Ready</p>
      <p id="count">Deliveries: 0</p>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
